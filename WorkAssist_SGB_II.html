  <style>
:root {
  --bg: #f3f4f9; --card: #ffffff; --card2: #f8f9fc; --ink: #0f172a; --muted: #64748b; --faint: #94a3b8; --line: #e6e8f0;
  --primary: #4f46e5; --primary-ink: #ffffff; --primary-soft: #eef0ff; --primary-line: #c7cbff;
  --ok: #059669; --ok-soft: #e7f8f1; --warn: #b45309; --warn-soft: #fff6e6; --bad: #dc2626; --bad-soft: #fdecec;
  --hero1: #4f46e5; --hero2: #7c3aed;
  --seg-rb: #6366f1; --seg-mb: #a78bfa; --seg-kdu: #38bdf8; --seg-inc: #10b981;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 28px rgba(15, 23, 42, .06);
  --r: 20px;
}
:root[data-theme="dark"] {
  --bg: #0b0f1c; --card: #131a2c; --card2: #182039; --ink: #e8ebff; --muted: #9aa5c3; --faint: #6b7697; --line: #232c47;
  --primary: #8b8cff; --primary-ink: #0b0f1c; --primary-soft: #1f2650; --primary-line: #3a4380;
  --ok: #34d399; --ok-soft: #10302a; --warn: #fbbf24; --warn-soft: #33290f; --bad: #f87171; --bad-soft: #3a1717;
  --hero1: #3730a3; --hero2: #6d28d9;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1c; --card: #131a2c; --card2: #182039; --ink: #e8ebff; --muted: #9aa5c3; --faint: #6b7697; --line: #232c47;
    --primary: #8b8cff; --primary-ink: #0b0f1c; --primary-soft: #1f2650; --primary-line: #3a4380;
    --ok: #34d399; --ok-soft: #10302a; --warn: #fbbf24; --warn-soft: #33290f; --bad: #f87171; --bad-soft: #3a1717;
    --hero1: #3730a3; --hero2: #6d28d9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary-line); outline-offset: 2px; }
a { color: var(--primary); }
.noscript { padding: 24px; }

/* Kopfzeile */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-size: 17px; letter-spacing: -.3px; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: -2px; }
.logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; font: 700 20px Georgia, serif; background: linear-gradient(135deg, var(--hero1), var(--hero2)); }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 24px 28px 80px; align-items: start; }
.form { display: grid; gap: 16px; min-width: 0; }
.result { position: sticky; top: 84px; display: grid; gap: 14px; }

/* Karten */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.card-head h2 { margin: 0; font-size: 17px; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
.num-badge { width: 26px; height: 26px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.sub { color: var(--muted); font-size: 13px; }

/* Segmente und Kacheln */
.seg { display: inline-flex; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px; text-align: left; display: flex; gap: 12px; align-items: center; font-weight: 650; }
.tile svg { width: 26px; height: 26px; flex: none; color: var(--muted); }
.tile small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.tile[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
.tile[aria-pressed="true"] svg { color: var(--primary); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* Felder */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.f label, .label { display: block; font-size: 12.5px; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
.money { position: relative; }
.money input, .f input, .f select, textarea { width: 100%; height: 48px; border: 1.5px solid var(--line); background: var(--card2); border-radius: 13px; padding: 0 14px; font-size: 16px; font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s; }
.money input { padding-right: 34px; }
.money::after { content: '€'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); font-weight: 600; pointer-events: none; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: var(--card); }
input.invalid { border-color: var(--bad); background: var(--bad-soft); }
input.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { border-color: var(--ok); background: var(--ok-soft); } }
.hint { font-size: 12px; color: var(--faint); margin-top: 5px; }
textarea { height: auto; min-height: 120px; padding: 12px 14px; line-height: 1.55; resize: vertical; font-size: 15px; }
.row-gap { margin-top: 14px; }
.section-label { font-size: 12px; font-weight: 750; letter-spacing: .6px; text-transform: uppercase; color: var(--faint); margin: 18px 0 10px; }

/* Stepper Kinder */
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--card2); }
.stepper button { border: 0; background: transparent; width: 44px; height: 44px; font-size: 20px; color: var(--primary); }
.stepper button:disabled { color: var(--faint); cursor: default; }
.stepper output { min-width: 36px; text-align: center; font-weight: 750; font-size: 17px; }
.kids { display: grid; gap: 10px; margin-top: 12px; }
.kid { display: grid; grid-template-columns: 90px 1fr 1fr 40px; gap: 10px; align-items: end; padding: 12px; border-radius: 15px; background: var(--card2); border: 1px solid var(--line); }
.kid .f input { background: var(--card); }
.kid .money input { background: var(--card); }
.toggle { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; cursor: pointer; user-select: none; min-height: 48px; }
.toggle input { appearance: none; width: 42px; height: 24px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; cursor: pointer; flex: none; margin: 0; }
.toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--primary); }
.toggle input:checked::after { transform: translateX(18px); }
.icon-btn { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--bad); border-color: var(--bad); }
.icon-btn svg, .btn svg { width: 18px; height: 18px; }

/* Aufklapper */
details.more { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
details.more > summary { cursor: pointer; list-style: none; font-size: 13.5px; font-weight: 650; color: var(--primary); display: flex; align-items: center; gap: 6px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: '+'; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--primary-soft); font-weight: 800; }
details.more[open] > summary::before { content: '−'; }
details.more > div { margin-top: 14px; }

/* Buttons */
.btn { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 15px; font-weight: 650; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--primary-line); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--card2); }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Ergebnis */
.hero { border-radius: var(--r); padding: 22px; color: #fff; background: linear-gradient(135deg, var(--hero1), var(--hero2)); box-shadow: 0 14px 40px rgba(79, 70, 229, .32); position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -60px; top: -90px; background: rgba(255,255,255,.08); }
.hero .k { font-size: 13px; opacity: .85; font-weight: 600; }
.hero .amount { font-size: 44px; font-weight: 800; letter-spacing: -1.6px; line-height: 1.1; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.hero .amount small { font-size: 16px; font-weight: 600; opacity: .8; letter-spacing: 0; }
.hero .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; opacity: .92; }
.hero.none { background: linear-gradient(135deg, #334155, #475569); box-shadow: none; }
.delta { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.18); font-size: 12.5px; font-weight: 700; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 84px 1fr 92px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 99px; background: var(--card2); display: flex; overflow: hidden; }
.bar span { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
.c-rb { background: var(--seg-rb); } .c-mb { background: var(--seg-mb); } .c-kdu { background: var(--seg-kdu); } .c-inc { background: var(--seg-inc); } .c-claim { background: var(--primary); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.t th { text-align: right; font-size: 11px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 0 0 8px; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 9px 0; border-top: 1px solid var(--line); }
table.t td:last-child { font-weight: 750; }
table.t tr.out td { color: var(--faint); }
table.t tfoot td { font-weight: 800; border-top: 2px solid var(--line); }
.notes { display: grid; gap: 8px; }
.note { display: flex; gap: 9px; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--card2); color: var(--muted); line-height: 1.45; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note b { color: inherit; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: s; }
.steps li { font-size: 13px; padding-left: 28px; position: relative; color: var(--ink); }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 1px; width: 19px; height: 19px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.norm { display: inline-block; font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border-radius: 6px; padding: 0 6px; margin-left: 4px; white-space: nowrap; }
.docs { display: grid; gap: 6px; }
.doc { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; padding: 9px 10px; border-radius: 11px; cursor: pointer; }
.doc:hover { background: var(--card2); }
.doc input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.doc small { display: block; color: var(--faint); font-size: 12px; }
.doc.done span { text-decoration: line-through; color: var(--faint); }
.foot { font-size: 11.5px; color: var(--faint); line-height: 1.5; padding: 0 4px; }
.empty-state { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 14px; }

/* Mobile Leiste, Toast, Dialog */
.mobile-bar { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 40; max-width: calc(100vw - 32px); }
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(8, 12, 28, .5); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border-radius: 20px; padding: 22px; max-width: 420px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.modal p { margin: 0 0 18px; font-size: 15px; }
.modal .btn-row { justify-content: flex-end; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1020px) {
  .layout { grid-template-columns: 1fr; padding: 16px 14px 100px; }
  .result { position: static; }
  .mobile-bar { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; border: 0; border-radius: 16px; padding: 12px 18px; color: #fff; background: linear-gradient(135deg, var(--hero1), var(--hero2)); box-shadow: 0 10px 30px rgba(79, 70, 229, .4); justify-content: space-between; align-items: center; font-weight: 650; }
  .mobile-bar b { font-size: 20px; letter-spacing: -.5px; }
  .mobile-bar.hide { display: none; }
  .toast { bottom: 84px; }
}
@media (max-width: 640px) {
  .top { padding: 10px 14px; }
  .brand small { display: none; }
  .card { padding: 17px; border-radius: 18px; }
  .grid, .grid.three { grid-template-columns: 1fr; }
  .kid { grid-template-columns: 80px 1fr 40px; }
  .kid .kg { grid-column: 1 / -1; grid-row: 2; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile { padding: 12px; }
  .hero .amount { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .top, .form, .mobile-bar, .btn { display: none !important; } .layout { display: block; } .result { position: static; } }

:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}

/* Reiter im Ergebnis */
.hidden { display: none !important; }
.tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 6px; border-radius: 10px; font-weight: 650; font-size: 13.5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tabs button[aria-selected="true"] { background: var(--primary-soft); color: var(--primary); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11.5px; font-weight: 800; display: inline-grid; place-items: center; }
.count.zero { background: var(--ok); }
.cta { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; text-align: left; border: 1.5px solid var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: 16px; padding: 14px 16px; font-size: 20px; }
.cta b { display: block; font-size: 15px; }
.cta small { display: block; font-size: 12.5px; opacity: .9; }

/* Checkliste */
.checks { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 11px 12px; border-radius: 13px; border: 1px solid var(--line); background: var(--card2); }
.check-text b { display: block; font-size: 13.5px; font-weight: 650; }
.check-text small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.check.st-vorhanden { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.check.st-vorhanden b, .check.st-entfaellt b { color: var(--faint); text-decoration: line-through; }
.check.st-fehlt { border-left: 4px solid var(--bad); }
.tri { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; justify-self: start; }
.tri button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.tri button[aria-pressed="true"][data-v="fehlt"] { background: var(--bad-soft); color: var(--bad); }
.tri button[aria-pressed="true"][data-v="vorhanden"] { background: var(--ok-soft); color: var(--ok); }
.tri button[aria-pressed="true"][data-v="entfaellt"] { background: var(--card2); color: var(--ink); }
.letter-box { margin-top: 18px; padding: 16px; border-radius: 16px; background: var(--primary-soft); border: 1px solid var(--primary-line); }
.letter-box h3 { margin: 0 0 12px; font-size: 15px; }
.letter-box .f input { background: var(--card); }
.preview { white-space: pre-wrap; font: 13px/1.6 system-ui, sans-serif; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0; max-height: 360px; overflow: auto; }

/* Aufgaben */
.todos { display: grid; gap: 6px; }
.todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); font-size: 13.5px; cursor: pointer; }
.todo input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--primary); flex: none; }
.todo.prio { border-left: 4px solid var(--warn); }
.todo.done > span { color: var(--faint); text-decoration: line-through; }

.letter-box.warnbox { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.letter-box p.hint { margin: 0 0 12px; }

/* Navigation und Ansichten */
.mainnav { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; overflow-x: auto; scrollbar-width: none; }
.mainnav button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 650; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.mainnav button[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
.layout.single { grid-template-columns: minmax(0, 860px); justify-content: center; }
.layout.single .result { display: none; }
.layout.single ~ .mobile-bar { display: none !important; }
.intro h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.6px; }
.vtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 16px; }
.vtiles.small { margin-top: 0; }
.vtile { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--card2); border-radius: 16px; padding: 14px; }
.vtile:hover { border-color: var(--primary); background: var(--primary-soft); }
.vtile b { display: block; font-size: 14.5px; }
.vtile small { display: block; color: var(--muted); font-size: 12.5px; }
.vicon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 18px; font-weight: 800; flex: none; }
.prio { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.progress { height: 8px; border-radius: 99px; background: var(--card2); overflow: hidden; margin-bottom: 10px; }
.progress span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.vsteps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.vstep { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card2); }
.vstep.done { opacity: .62; }
.vstep.done p { text-decoration: line-through; }
.vcheck { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.vcheck input { width: 19px; height: 19px; margin: 1px 0 0; accent-color: var(--primary); }
.vbody p { margin: 0 0 6px; font-size: 14px; }
.badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
.badge.tt { background: #e0f2fe; color: #075985; } .badge.tw { background: #ede9fe; color: #5b21b6; } .badge.th { background: #dcfce7; color: #166534; }
.vnote { width: 100%; min-height: 38px; height: 38px; margin-top: 6px; padding: 8px 12px; font-size: 13.5px; border-radius: 10px; resize: vertical; }
.vbody .btn { margin-top: 4px; }
.f.full { grid-column: 1 / -1; }
.frist .grid { margin-bottom: 10px; }
.frist-t td:first-child { width: 50%; }
.frist-t td { vertical-align: top; text-align: left; }
.frist-t td:last-child { font-weight: 400; text-align: right; }
.ue { display: grid; gap: 8px; margin-top: 10px; }
.ue-item { padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: var(--card2); display: grid; gap: 8px; }
.ue-item p { margin: 0; font-size: 14px; }
.ue-item.ok { border-color: var(--ok); background: var(--ok-soft); }
.ue-item.bad { border-color: var(--bad); background: var(--bad-soft); }
.tri button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); }
@media (max-width: 760px) { .top { flex-wrap: wrap; } .mainnav { order: 3; width: 100%; } .vstep { grid-template-columns: 1fr; } }

    while ((m = rx1.exec(text))) {
      const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
      const value = `${pad(m[1])}.${pad(m[2])}.${y}`;
      if (validDate(value)) out.push({ start: m.index, end: m.index + m[0].length, value, exact: m[3].length === 4 && m[1].length === 2 && m[2].length === 2 });
    }
    const rx2 = new RegExp(`(\\d{1,2})\\.\\s*(${Object.keys(MONTHS).join('|')})\\s+(\\d{4})`, 'giu');
    while ((m = rx2.exec(text))) {
      const value = `${pad(m[1])}.${pad(MONTHS[m[2].toLowerCase()])}.${m[3]}`;
      if (validDate(value)) out.push({ start: m.index, end: m.index + m[0].length, value, exact: true });
    }
    return out.sort((a, b) => a.start - b.start);
  }

  function overlaps(a, list) { return list.some((b) => a.start < b.end && b.start < a.end); }

  /**
   * Erkennt Angaben aus fiktivem Freitext.
   * Rückgabe: findings (je Angabe mit Fundstelle und Vertrauen), unassigned (Beträge ohne Zuordnung), docHints, kindHint.
   */
  function extract(textIn) {
    const text = String(textIn || '');
    const raw = [];
    const unassigned = [];
    const docHints = [];
    const add = (key, value, start, end, confidence, rule) => raw.push({ key, value: String(value), start, end, confidence, rule });
    const sents = sentences(text);
    const sentenceOf = (pos) => sents.find((s) => pos >= s.start && pos < s.end) || { start: 0, end: text.length };
    const sentText = (s) => text.slice(s.start, s.end);

    // --- Vorgang ---
    let m;
    const wbaRx = /weiterbewilligung\p{L}*|folgeantrag|\bwba\b/giu;
    if ((m = wbaRx.exec(text))) add('kind', 'wba', m.index, m.index + m[0].length, 'hoch', 'Begriff „Weiterbewilligung“');
    else {
      const erstRx = /erstantrag|erstmal\p{L}*\s+(?:\S+\s+){0,5}?antrag|neuantrag/giu;
      if ((m = erstRx.exec(text))) add('kind', 'erst', m.index, m.index + m[0].length, 'hoch', 'Begriff „Erstantrag/erstmals“');
    }

    // --- Datumsangaben ---
    const dates = findDates(text);
    const dateKw = [
      ['ignore', /geboren|geburtsdatum|geb\.|einzug|eingezogen|mietbeginn|seit\s+dem|trennung/giu, 0],
      ['periodEnd', new RegExp(`${NB}(?:bis(?:\\s+zum)?|endet|ende)${NA}`, 'giu'), 1],
      ['periodStart', new RegExp(`${NB}(?:bewilligungszeitraum|leistungszeitraum|zeitraum|beginn\\p{L}*|ab(?:\\s+dem)?|vom|leistungen\\s+ab)${NA}`, 'giu'), 1],
      ['applicationDate', new RegExp(`${NB}(?:antrag\\p{L}*|beantragt|eingegangen|eingang|vorgesprochen|gestellt|eingereicht)${NA}`, 'giu'), 1],
    ];
    const dateSpans = dates.map((d) => ({ start: d.start, end: d.end }));
    for (const d of dates) {
      const s = sentenceOf(d.start);
      const before = text.slice(Math.max(s.start, d.start - 60), d.start);
      const after = text.slice(d.end, Math.min(s.end, d.end + 30));
      let best = null;
      if (/(?:antrag\p{L}*|beantragt|gestellt|eingegangen)\s+(?:\p{L}+\s+){0,2}?(?:vom|am)\s*$/iu.test(before)) best = { cat: 'applicationDate', dist: 0 };
      for (const [cat, rx] of dateKw) {
        if (best && best.dist === 0) break;
        rx.lastIndex = 0;
        let k;
        while ((k = rx.exec(before))) {
          const dist = before.length - (k.index + k[0].length);
          if (!best || dist < best.dist) best = { cat, dist };
        }
        rx.lastIndex = 0;
        if ((k = rx.exec(after))) {
          const dist = k.index + 8; // Begriffe nach dem Datum leicht schwächer gewichten
          if (!best || dist < best.dist) best = { cat, dist };
        }
      }
      if (!best || best.cat === 'ignore') { unassigned.push({ start: d.start, end: d.end, text: d.value, label: best ? 'Datum (z. B. Geburt oder Einzug), nicht übernommen' : 'Datum ohne erkennbare Bedeutung' }); continue; }
      let conf = best.dist <= 25 ? 'hoch' : 'mittel';
      if (!d.exact && conf === 'hoch') conf = 'mittel';
      const label = { applicationDate: 'Antragsbezug', periodStart: 'Zeitraumbeginn', periodEnd: 'Zeitraumende' }[best.cat];
      add(best.cat, d.value, d.start, d.end, conf, `Datum mit ${label} im selben Satz`);
    }

    // --- Wohnfläche ---
    const areaRx = /(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:m²|m2|qm|quadratmeter)(?![\p{L}\d])/giu;
    const areaSpans = [];
    while ((m = areaRx.exec(text))) {
      areaSpans.push({ start: m.index, end: m.index + m[0].length });
      add('area', m[1].replace('.', ','), m.index, m.index + m[0].length, 'hoch', 'Zahl mit m²/qm');
    }

    // --- Wohnort ---
    const cities = ['Marl', 'Recklinghausen', 'Herten', 'Gladbeck', 'Dorsten', 'Datteln', 'Castrop-Rauxel', 'Waltrop', 'Oer-Erkenschwick', 'Haltern am See', 'Bochum', 'Dortmund', 'Essen', 'Gelsenkirchen', 'Bottrop', 'Münster', 'Köln', 'Düsseldorf'];
    let cityFound = false;
    for (const c of cities) {
      const rx = new RegExp(`${NB}${c.replace(/[-\s]/g, (x) => (x === ' ' ? '\\s+' : '-'))}${NA}`, 'u');
      const cm = rx.exec(text);
      if (cm) { add('city', c, cm.index, cm.index + cm[0].length, 'hoch', 'Bekannter Ortsname'); cityFound = true; break; }
    }
    if (!cityFound) {
      const cm = /(?:wohnt|lebt|wohnen|leben|wohnhaft)\s+(?:\p{L}+\s+){0,6}?in\s+(\p{Lu}\p{Ll}+(?:-\p{Lu}\p{Ll}+)?)/u.exec(text);
      if (cm && !/^(Der|Die|Das|Einer|Einem|Einer|Trennung|Bedarfsgemeinschaft)$/.test(cm[1])) {
        const st = cm.index + cm[0].length - cm[1].length;
        add('city', cm[1], st, st + cm[1].length, 'mittel', '„wohnt/lebt … in <Ort>“');
      }
    }

    // --- Personen ---
    const NUMW = { ein: 1, eine: 1, einem: 1, einen: 1, einer: 1, zwei: 2, drei: 3, vier: 4, fünf: 5, sechs: 6, sieben: 7, acht: 8 };
    const adultsExplicit = new RegExp(`(\\d|${Object.keys(NUMW).join('|')})\\s+erwachsene${NA}`, 'iu').exec(text);
    if (adultsExplicit) {
      const n = /\d/.test(adultsExplicit[1]) ? Number(adultsExplicit[1]) : NUMW[adultsExplicit[1].toLowerCase()];
      add('adultCount', n, adultsExplicit.index, adultsExplicit.index + adultsExplicit[0].length, 'hoch', 'Anzahl Erwachsene ausdrücklich genannt');
    } else {
      const coupleRx = new RegExp(`${NB}(?:ehepaar|eheleute|paar|partner(?:in)?|lebensgefährt\\p{L}*|ehemann|ehefrau|verheiratet\\p{L}*)${NA}`, 'giu');
      let couple = null;
      while ((m = coupleRx.exec(text))) {
        const s = sentText(sentenceOf(m.index)).toLowerCase();
        if (/trennung|getrennt|geschieden|verstorben|ehemalig|ex-|früher\p{L}*\s+partner|ausgezogen/u.test(s)) continue;
        couple = m; break;
      }
      if (couple) add('adultCount', 2, couple.index, couple.index + couple[0].length, 'mittel', 'Hinweis auf Paar oder Partnerschaft');
      else {
        const single = new RegExp(`${NB}(?:alleinerziehend\\p{L}*|alleinstehend\\p{L}*|lebt\\s+allein|allein\\s+lebend\\p{L}*)${NA}`, 'iu').exec(text);
        const parent = new RegExp(`${NB}(?:mutter|vater)${NA}`, 'iu').exec(text);
        if (single) add('adultCount', 1, single.index, single.index + single[0].length, 'hoch', '„alleinerziehend/alleinstehend“');
        else if (parent) add('adultCount', 1, parent.index, parent.index + parent[0].length, 'mittel', 'Elternteil ohne Partnerhinweis');
      }
    }

    // Kinder: Alter
    const CHILD = '(?:kindern|kinder|kind|töchtern|töchter|tochter|söhnen|söhne|sohn|kleinkind|baby)';
    const ageHits = [];
    const pushAge = (age, start, end, conf, rule) => {
      if (age > 30) return;
      if (ageHits.some((h) => start < h.end && h.start < end)) return;
      ageHits.push({ age, start, end, conf, rule });
    };
    const ageA = new RegExp(`(\\d{1,2})\\s*(?:-\\s*)?(?:jahre?\\s+alte[nrsm]?|jährige[nrsm]?)\\s+(?:\\p{L}+\\s+)?${CHILD}${NA}`, 'giu');
    while ((m = ageA.exec(text))) pushAge(Number(m[1]), m.index, m.index + m[0].length, 'hoch', '„<Zahl> Jahre alt“ vor Kind');
    const ageB = new RegExp(`${NB}${CHILD}\\s*\\(\\s*(\\d{1,2})(?:\\s*(?:j\\.?|jahre))?\\s*\\)`, 'giu');
    while ((m = ageB.exec(text))) pushAge(Number(m[1]), m.index, m.index + m[0].length, 'hoch', 'Kind mit Alter in Klammern');
    const ageC = new RegExp(`${NB}(?:kind|tochter|sohn)${NA}[^.!?\\n]{0,25}?(?:ist|wird)\\s+(\\d{1,2})\\s+jahre`, 'giu');
    while ((m = ageC.exec(text))) pushAge(Number(m[1]), m.index, m.index + m[0].length, 'mittel', '„Kind ist <Zahl> Jahre“');
    const ageD = new RegExp(`${NB}${CHILD}${NA}[^.!?\\n]{0,30}?im\\s+alter\\s+von\\s+((?:\\d{1,2}(?:\\s*(?:,|und)\\s*)?)+)\\s*jahre`, 'giu');
    while ((m = ageD.exec(text))) {
      const st = m.index, en = m.index + m[0].length;
      for (let i = ageHits.length - 1; i >= 0; i--) if (ageHits[i].start < en && st < ageHits[i].end) ageHits.splice(i, 1);
      for (const a of m[1].match(/\d{1,2}/g).map(Number)) if (a <= 30) ageHits.push({ age: a, start: st, end: en, conf: 'hoch', rule: 'Altersliste „im Alter von …“' });
    }
    ageHits.sort((a, b) => a.start - b.start);

    // Kinder: Anzahl
    let childCount = null;
    const countRx = new RegExp(`${NB}(\\d|${Object.keys(NUMW).join('|')})\\s+(?:\\p{Ll}+\\s+){0,2}?(kinder[n]?|kind|töchter[n]?|söhne[n]?|tochter|sohn)${NA}`, 'giu');
    let countSum = 0, countFirst = null, countLast = null;
    while ((m = countRx.exec(text))) {
      if (/^\d$/.test(m[1]) && /jahre|jährig/i.test(m[0])) continue; // "5 Jahre altes Kind" ist Alter, keine Anzahl
      const between = m[0].slice(m[1].length);
      if (/jahre?\s|jährig/i.test(between)) {
        // "ein 5 Jahre altes Kind": Zahlwort zählt, Ziffer ist Alter
        if (/\d/.test(m[1])) continue;
      }
      const n = /\d/.test(m[1]) ? Number(m[1]) : NUMW[m[1].toLowerCase()];
      if (!n) continue;
      countSum += n; countFirst = countFirst ?? m.index; countLast = m.index + m[0].length;
    }
    const noKids = new RegExp(`${NB}(?:keine\\s+kinder|kinderlos)${NA}`, 'iu').exec(text);
    if (countSum > 0) childCount = { n: Math.max(countSum, ageHits.length), start: countFirst, end: countLast, conf: 'hoch', rule: 'Anzahl der Kinder genannt' };
    else if (ageHits.length) childCount = { n: ageHits.length, start: ageHits[0].start, end: ageHits[ageHits.length - 1].end, conf: 'mittel', rule: 'Aus genannten Kinderaltern abgeleitet' };
    else if (noKids) childCount = { n: 0, start: noKids.index, end: noKids.index + noKids[0].length, conf: 'hoch', rule: '„keine Kinder“' };
    else {
      const anyChild = new RegExp(`${NB}(?:ihr\\p{L}*|sein\\p{L}*|mit)\\s+(?:\\p{L}+\\s+)?(kind|tochter|sohn|baby)${NA}`, 'iu').exec(text);
      if (anyChild) childCount = { n: 1, start: anyChild.index, end: anyChild.index + anyChild[0].length, conf: 'mittel', rule: 'Ein Kind erwähnt' };
    }
    if (childCount) add('childCount', childCount.n, childCount.start, childCount.end, childCount.conf, childCount.rule);
    if (ageHits.length) {
      const n = childCount ? childCount.n : ageHits.length;
      const list = ageHits.map((h) => h.age);
      while (list.length < n) list.push('?');
      const conf = ageHits.every((h) => h.conf === 'hoch') && list.length === ageHits.length ? 'hoch' : 'mittel';
      add('childAges', list.join(', '), ageHits[0].start, Math.max(...ageHits.map((h) => h.end)), conf, ageHits.length > 1 ? 'Mehrere Altersangaben zu Kindern' : ageHits[0].rule);
    }

    // --- Heizung und Warmwasser ---
    const heatingRules = [
      ['gas', /gasheizung|gasetagenheizung|mit\s+gas\s+beheizt|erdgas|gastherme|gasabschlag/iu],
      ['district', /fernwärme/iu],
      ['oil', /ölheizung|heizöl/iu],
      ['electric', /nachtspeicher\p{L}*|wärmepumpe|elektroheizung|stromheizung/iu],
    ];
    for (const [val, rx] of heatingRules) { const hm = rx.exec(text); if (hm) { add('heating', val, hm.index, hm.index + hm[0].length, 'hoch', 'Heizungsart genannt'); break; } }
    let wm = /durchlauferhitzer|boiler|elektrischer\s+warmwasserbereiter|dezentral\p{L}*\s+warmwasser\p{L}*|warmwasser\p{L}*\s+(?:\p{L}+\s+){0,3}?dezentral/iu.exec(text);
    if (wm) add('water', 'decentral', wm.index, wm.index + wm[0].length, 'hoch', 'Dezentrale Warmwasserbereitung genannt');
    else if ((wm = /zentral\p{L}*\s+warmwasser\p{L}*|warmwasser\p{L}*\s+(?:\p{L}+\s+){0,4}?(?:zentral|über\s+die\s+heizung|über\s+die\s+gas\p{L}*)/iu.exec(text))) add('water', 'central', wm.index, wm.index + wm[0].length, 'hoch', 'Zentrale Warmwasserbereitung genannt');

    // --- Status Kindergeld / Unterhalt / Einkommen ---
    const statusFor = (key, rx) => {
      rx.lastIndex = 0;
      let sm;
      while ((sm = rx.exec(text))) {
        const s = sentenceOf(sm.index);
        const st = sentText(s).toLowerCase();
        let val = null, conf = 'hoch', rule = '';
        if (/ungeklärt|unklar|offen|nicht\s+bekannt|noch\s+zu\s+klären|unbekannt/.test(st)) { val = 'unknown'; rule = 'Ausdrücklich als ungeklärt beschrieben'; }
        else if (/\bkein\p{L}*\b|\bnicht\b|\bniemals\b/u.test(st)) { val = 'no'; rule = 'Verneinung im Satz'; conf = 'mittel'; }
        else if (/erhält|erhalten|bezieht|beziehen|bekommt|bekommen|wird\s+gezahlt|werden\s+gezahlt|zahlt|gezahlt|bezogen|\d/.test(st)) { val = 'yes'; rule = 'Bezug im Satz beschrieben'; conf = 'mittel'; }
        if (val) { add(key, val, sm.index, sm.index + sm[0].length, conf, rule); return; }
      }
    };
    statusFor('childBenefit', /kindergeld/giu);
    statusFor('maintenance', /unterhaltsvorschuss|kindesunterhalt|unterhalt\p{L}*/giu);
    const noIncome = /(?:kein|keine|ohne)\s+(?:\p{L}+\s+)?(?:einkommen|einnahmen|erwerbseinkommen)|nicht\s+erwerbstätig|arbeitslos\p{L}*/iu.exec(text);
    const empl = /(?:arbeitet|beschäftigt|angestellt|erwerbstätig|teilzeit|vollzeit)/iu.exec(text);
    const mini = /minijob|geringfügig\p{L}*/iu.exec(text);
    const self = /selbstständig\p{L}*|selbständig\p{L}*|freiberuf\p{L}*/iu.exec(text);
    if (mini) add('incomeType', 'minijob', mini.index, mini.index + mini[0].length, 'hoch', 'Minijob genannt');
    else if (self) add('incomeType', 'selfemployed', self.index, self.index + self[0].length, 'hoch', 'Selbstständigkeit genannt');
    else if (empl && !(noIncome && /nicht\s+erwerbstätig/i.test(noIncome[0]))) add('incomeType', 'employment', empl.index, empl.index + empl[0].length, 'mittel', 'Beschäftigung beschrieben');
    else if (noIncome) add('incomeType', 'none', noIncome.index, noIncome.index + noIncome[0].length, 'mittel', 'Kein Einkommen beschrieben');

    // --- Beträge ---
    const kwHits = [];
    KW_RX.lastIndex = 0;
    while ((m = KW_RX.exec(text))) {
      const cat = Object.keys(m.groups).find((g) => m.groups[g] !== undefined);
      kwHits.push({ cat, start: m.index, end: m.index + m[0].length, word: m[0], used: false });
    }
    const numRx = /(?<![\d.,])(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+,\d{1,2}|\d+\.\d{1,2}(?![\d.])|\d+)(?![\d])/g;
    const amounts = [];
    while ((m = numRx.exec(text))) {
      const span = { start: m.index, end: m.index + m[0].length };
      if (overlaps(span, dateSpans) || overlaps(span, areaSpans)) continue;
      const after = text.slice(span.end, span.end + 20);
      const before = text.slice(Math.max(0, span.start - 6), span.start);
      if (/^[.,]\d/.test(after)) continue;
      if (/^\s*(?:-\s*)?(?:jahre?n?|jährig\p{L}*|monate?n?|wochen|tage?n?|%|prozent|kinder?n?|personen|erwachsene|uhr|zimmer|qm|m²|stunden|std)/iu.test(after)) continue;
      const cur = after.match(/^\s*(?:€|euro(?!\p{L})|eur(?!\p{L}))/iu);
      const curBefore = /(?:€|eur(?:o)?)\s*$/i.test(before);
      amounts.push({ ...span, raw: m[0], value: num(m[0]), currency: !!(cur || curBefore), cEnd: cur ? span.end + cur[0].length : span.end });
    }
    const verbLink = /(?:netto|brutto|beträgt|betragen|betrug|kostet|kosten|liegt\s+bei|liegen\s+bei|in\s+höhe\s+von|von|:|=|verdient|zahlt|erhält|bekommt|monatlich|mtl\.?|werden|wurden|sind|ist|jetzt|aktuell|insgesamt|rund|ca\.?|etwa)\s*$/iu;
    const afterGapOk = /^\s*(?:(?:für|an|als|im|pro|monatlich|mtl\.?|monat|die|der|den|das|gemeldete[nr]?|bisherige[nr]?|neue[nr]?|aktuelle[nr]?)\s+)*$/iu;
    const bySentence = new Map();
    for (const a of amounts) {
      const s = sentenceOf(a.start);
      if (!bySentence.has(s)) bySentence.set(s, []);
      bySentence.get(s).push(a);
    }
    for (const [s, list] of bySentence) {
      let lastCat = null;
      list.forEach((a, i) => {
        const prevEnd = i ? list[i - 1].cEnd : s.start;
        const nextStart = i < list.length - 1 ? list[i + 1].start : s.end;
        const beforeHit = kwHits.filter((h) => !h.used && h.start >= prevEnd && h.end <= a.start).pop();
        const afterHit = kwHits.find((h) => !h.used && h.start >= a.cEnd && h.start < nextStart && afterGapOk.test(text.slice(a.cEnd, h.start)));
        let hit = null, conf = 'mittel', rule = '';
        const gapBefore = beforeHit ? text.slice(beforeHit.end, a.start) : '';
        const beforeStrong = beforeHit && gapBefore.length <= 45 && (verbLink.test(gapBefore) || /^\s*$/.test(gapBefore));
        if (beforeStrong) { hit = beforeHit; conf = 'hoch'; rule = `„${beforeHit.word}“ direkt vor dem Betrag`; }
        else if (afterHit && a.currency) { hit = afterHit; conf = 'hoch'; rule = `„${afterHit.word}“ direkt nach dem Betrag`; }
        else if (beforeHit) { hit = beforeHit; conf = gapBefore.length <= 45 ? 'mittel' : 'niedrig'; rule = `„${beforeHit.word}“ im selben Satzteil`; }
        let cat = hit ? hit.cat : null;
        if (hit) hit.used = true;
        else if (lastCat && a.currency) { cat = lastCat; conf = 'mittel'; rule = 'Fortsetzung des vorherigen Betrags im Satz'; }
        if (!a.currency && conf === 'hoch') conf = 'mittel';
        if (!cat) {
          if (a.currency) unassigned.push({ start: a.start, end: a.cEnd, text: text.slice(a.start, a.cEnd), label: 'Betrag ohne erkennbare Zuordnung' });
          return;
        }
        lastCat = cat;
        if (cat === 'ignore') { unassigned.push({ start: a.start, end: a.cEnd, text: text.slice(a.start, a.cEnd), label: `${CATEGORY_LABEL.ignore}: „${hit ? hit.word : ''}“` }); return; }
        // Zeitbezug: nächstgelegener Marker vor dem Betrag im Satz
        const head = text.slice(s.start, a.start);
        let prevPos = -1, currPos = -1, pm;
        PREV_RX.lastIndex = 0; while ((pm = PREV_RX.exec(head))) prevPos = pm.index;
        CURR_RX.lastIndex = 0; while ((pm = CURR_RX.exec(head))) currPos = pm.index;
        let key = CAT_FIELD[cat] || cat;
        if (prevPos > currPos && PREVIOUS_KEY[cat]) { key = PREVIOUS_KEY[cat]; rule += ', Zeitbezug „bisher“'; }
        add(key, String(a.value).replace('.', ','), a.start, a.cEnd, conf, rule);
        if (key === 'childBenefitAmount') add('childBenefit', 'yes', a.start, a.cEnd, conf, 'Kindergeldbetrag genannt');
        if (key === 'maintenanceAmount') add('maintenance', 'yes', a.start, a.cEnd, conf, 'Unterhaltsbetrag genannt');
      });
    }

    // --- Hinweise auf vorhandene oder fehlende Unterlagen ---
    const DOCS = [
      ['rent', /mietvertrag|mietbescheinigung|mietaufstellung/giu],
      ['heizabrechnung', /heizkostenabrechnung|nebenkostenabrechnung|betriebskostenabrechnung/giu],
      ['abschlag', /abschlagsplan|abschlagsrechnung|abschlagsschreiben/giu],
      ['income', /lohnabrechnung\p{L}*|gehaltsabrechnung\p{L}*|verdienstbescheinigung\p{L}*|einkommensnachweis\p{L}*|arbeitsvertrag/giu],
      ['kindergeld', /kindergeldbescheid|kindergeldnachweis/giu],
      ['unterhalt', /unterhaltstitel|unterhaltsvorschussbescheid|unterhaltsnachweis/giu],
    ];
    for (const [doc, rx] of DOCS) {
      rx.lastIndex = 0;
      let dm;
      while ((dm = rx.exec(text))) {
        const st = sentText(sentenceOf(dm.index)).toLowerCase();
        const neg = /nicht|fehlt|fehlen|kein\p{L}*|noch\s+aus|ausstehend/u.test(st);
        const pos = /liegt|liegen|eingereicht|vorgelegt|vorhanden|beigefügt|eingegangen|abgegeben/.test(st);
        if (pos || neg) docHints.push({ doc, state: neg ? 'fehlt' : 'vorhanden', start: dm.index, end: dm.index + dm[0].length, text: sentText(sentenceOf(dm.index)).trim() });
      }
    }

    // --- Zusammenführen: pro Feld bester Treffer, Alternativen merken ---
    const byKey = new Map();
    for (const f of raw) {
      if (!byKey.has(f.key)) byKey.set(f.key, []);
      byKey.get(f.key).push(f);
    }
    const findings = [];
    for (const [key, list] of byKey) {
      const sorted = [...list].sort((a, b) => CONF_RANK[b.confidence] - CONF_RANK[a.confidence] || a.start - b.start);
      const best = { ...sorted[0] };
      const alternatives = [...new Set(list.map((x) => x.value).filter((v) => v !== best.value))];
      if (alternatives.length) {
        best.alternatives = alternatives;
        if (FIELDS[key] && FIELDS[key].type !== 'select') best.confidence = best.confidence === 'hoch' ? 'mittel' : 'niedrig';
        best.rule += ` · weitere Werte im Text: ${alternatives.join(', ')}`;
      }
      best.snippet = snippet(text, best.start, best.end);
      findings.push(best);
    }
    findings.sort((a, b) => a.start - b.start);
    unassigned.forEach((u) => { u.snippet = snippet(text, u.start, u.end); });
    return { findings, unassigned, docHints };
  }

  function snippet(text, start, end, radius = 34) {
    const s = Math.max(0, start - radius), e = Math.min(text.length, end + radius);
    return { before: (s > 0 ? '…' : '') + text.slice(s, start).replace(/\s+/g, ' ').trimStart(), match: text.slice(start, end), after: text.slice(end, e).replace(/\s+/g, ' ').trimEnd() + (e < text.length ? '…' : '') };
  }

  /**
   * Übernimmt Erkennungsergebnisse in den Fallzustand.
   * Manuell eingegebene oder bestätigte Werte werden nie überschrieben; Abweichungen werden als Konflikt gemeldet.
   */
  function applyFindings(values, meta, findings) {
    const conflicts = [];
    let applied = 0;
    const touched = new Set();
    for (const f of findings) {
      touched.add(f.key);
      const m = meta[f.key];
      const current = values[f.key];
      if (m && (m.status === 'manuell' || m.status === 'bestätigt')) {
        if (String(current) !== f.value && f.value !== 'unknown') conflicts.push({ key: f.key, current, proposed: f.value, finding: f });
        continue;
      }
      values[f.key] = f.value;
      meta[f.key] = { status: 'vorgeschlagen', confidence: f.confidence, start: f.start, end: f.end, rule: f.rule, snippet: f.snippet, alternatives: f.alternatives || [] };
      applied++;
    }
    // Frühere, nicht bestätigte Vorschläge, die im neuen Text nicht mehr vorkommen, entfernen.
    for (const [key, m] of Object.entries(meta)) {
      if (m && m.status === 'vorgeschlagen' && !touched.has(key)) {
        values[key] = FIELDS[key] && FIELDS[key].def !== undefined ? FIELDS[key].def : '';
        delete meta[key];
      }
    }
    return { applied, conflicts };
  }

  /* ------------------------------------------------------------------ *
   * Datenschutz-Warnung: Muster echter Sozialdaten erkennen             *
   * ------------------------------------------------------------------ */
  function detectSensitive(text) {
    const t = String(text || '');
    const rules = [
      ['IBAN', /\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){3,7}(?:\s?[A-Z0-9]{1,4})?\b/],
      ['E-Mail-Adresse', /[\w.+-]+@[\w-]+\.[\w.]{2,}/],
      ['Telefonnummer', /(?:\+49|\b0)\d{2,5}[\s/-]?\d{3,}[\s-]?\d{0,6}\b/],
      ['BG-Nummer', /\b\d{5}\s?BG\s?\d{7}\b/i],
      ['Kundennummer', /\b\d{3}[A-Z]\d{6}\b/],
      ['Rentenversicherungsnummer', /\b\d{2}\s?\d{6}\s?[A-Z]\s?\d{3}\b/],
      ['Steuer-ID', /\b\d{11}\b/],
      ['Anrede mit Namen', /\b(?:Frau|Herr|Herrn)\s+\p{Lu}\p{Ll}+/u],
      ['Geburtsdatum', /geb(?:oren|\.)\s*(?:am\s*)?\d{1,2}\.\d{1,2}\.\d{2,4}/i],
      ['Straße mit Hausnummer', /\b\p{Lu}\p{Ll}+(?:straße|str\.|weg|allee|platz|gasse)\s+\d{1,4}\s?[a-z]?\b/u],
    ];
    return rules.filter(([, rx]) => rx.test(t)).map(([label]) => label);
  }

  /* ------------------------------------------------------------------ *
   * Weiterbewilligung: Vergleich bisher / neu                           *
   * ------------------------------------------------------------------ */
  function persons(v) {
    const a = num(v.adultCount), c = num(v.childCount);
    return a === null || c === null ? null : a + c;
  }
  function warmOf(bkk, heat) { const b = num(bkk), h = num(heat); return b === null || h === null ? null : b + h; }
  function compareRow(label, prev, curr, kind = 'money') {
    const a = typeof prev === 'number' ? prev : num(prev);
    const b = typeof curr === 'number' ? curr : num(curr);
    if (a === null || b === null) return { label, prev: a, curr: b, delta: null, pct: null, status: 'unbekannt', kind };
    const delta = Math.round((b - a) * 100) / 100;
    const pct = a === 0 ? null : Math.round((delta / a) * 1000) / 10;
    return { label, prev: a, curr: b, delta, pct, status: delta === 0 ? 'gleich' : delta > 0 ? 'gestiegen' : 'gesunken', kind };
  }
  function compareWba(v) {
    return [
      compareRow('Bruttokaltmiete', v.previousBkk, v.bkk),
      compareRow('Heizkosten', v.previousHeat, v.heat),
      compareRow('Warmmiete (Summe)', warmOf(v.previousBkk, v.previousHeat), warmOf(v.bkk, v.heat)),
      compareRow('Gemeldetes Einkommen', v.previousIncome, v.currentIncome),
      compareRow('Personen im Haushalt', v.previousPersons, persons(v), 'count'),
    ];
  }

  /* ------------------------------------------------------------------ *
   * Prüfpunkte: Tatsachen getrennt von rechtlicher Würdigung            *
   * ------------------------------------------------------------------ */
  const optLabel = (key, val) => { const o = (FIELDS[key].options || []).find(([k]) => k === val); return o ? o[1] : val; };
  function displayValue(key, v) {
    const f = FIELDS[key];
    if (!f) return String(v ?? '');
    if (!isFilled(key, v)) return f.type === 'select' ? optLabel(key, f.def) : '';
    if (f.type === 'money') return money(v);
    if (f.type === 'select') return optLabel(key, v);
    if (f.type === 'area') return `${String(v).replace('.', ',')} m²`;
    return String(v);
  }

  function dataQuality(v) {
    const out = [];
    for (const key of Object.keys(FIELDS)) {
      const err = validateField(key, v[key]);
      if (err) out.push({ key, text: `${FIELDS[key].label}: ${err}` });
    }
    if (validDate(v.periodStart) && validDate(v.periodEnd) && compareDates(v.periodEnd, v.periodStart) < 0) out.push({ key: 'periodEnd', text: 'Das Ende des Zeitraums liegt vor dem Beginn.' });
    if (validDate(v.periodStart) && validDate(v.periodEnd)) {
      const months = (toUTC(v.periodEnd) - toUTC(v.periodStart)) / 86400000 / 30.44;
      if (months > 12.2) out.push({ key: 'periodEnd', text: 'Der Zeitraum ist länger als zwölf Monate. Bitte § 41 Abs. 3 SGB II in der geltenden Fassung prüfen.' });
    }
    const b = num(v.bkk), h = num(v.heat), w = num(v.warm), n = num(v.netCold), o = num(v.opCosts);
    if (b !== null && h !== null && w !== null && Math.abs(w - b - h) > 0.01) out.push({ key: 'warm', text: `Warmmiete (${money(w)}) ≠ Bruttokaltmiete + Heizkosten (${money(b + h)}).` });
    if (n !== null && o !== null && b !== null && Math.abs(b - n - o) > 0.01) out.push({ key: 'bkk', text: `Bruttokaltmiete (${money(b)}) ≠ Nettokaltmiete + Nebenkosten (${money(n + o)}).` });
    const ages = parseAges(v.childAges).filter((a) => !Number.isNaN(a));
    const cc = num(v.childCount);
    if (cc !== null && ages.length > cc) out.push({ key: 'childAges', text: `Es sind ${ages.length} Altersangaben, aber ${cc} Kinder erfasst.` });
    if (validDate(v.applicationDate) && validDate(v.periodStart) && v.kind === 'erst' && compareDates(v.periodStart, firstOfMonth(v.applicationDate)) < 0) out.push({ key: 'periodStart', text: 'Der Zeitraum beginnt vor dem Monat der Antragstellung. Bitte prüfen.' });
    return out;
  }

  /** Effektive Werte: Bruttokaltmiete/Warmmiete aus Teilbeträgen ableiten, ohne Felder zu überschreiben. */
  function derived(v) {
    const out = {};
    const n = num(v.netCold), o = num(v.opCosts), b = num(v.bkk), h = num(v.heat), w = num(v.warm);
    out.bkk = b !== null ? b : n !== null && o !== null ? n + o : null;
    out.warm = w !== null ? w : out.bkk !== null && h !== null ? out.bkk + h : null;
    out.heat = h !== null ? h : w !== null && out.bkk !== null ? Math.max(0, w - out.bkk) : null;
    out.hasHousing = [n, o, b, h, w].some((x) => x !== null);
    out.persons = persons(v);
    out.ages = parseAges(v.childAges).filter((a) => a !== null && !Number.isNaN(a));
    return out;
  }

  function issues(v) {
    const d = derived(v);
    const fact = (key) => ({ key, label: FIELDS[key].label, value: displayValue(key, v[key]), known: isFilled(key, v[key]) && !validateField(key, v[key]) });
    const list = [];
    const push = (o) => list.push({ facts: [], questions: [], norms: [], severity: 'offen', ...o, open: (o.facts || []).filter((f) => !f.known).map((f) => f.label) });

    const dq = dataQuality(v);
    if (dq.length) list.push({ id: 'daten', title: 'Widersprüche und Eingabefehler', severity: 'fehler', facts: [], open: [], questions: dq.map((x) => x.text), norms: ['sgb10_20'], keys: dq.map((x) => x.key) });

    const antragFacts = [fact('kind'), ...(v.kind === 'erst' ? [fact('applicationDate')] : []), fact('periodStart'), fact('periodEnd')];
    const q1 = [
      'Ist ein wirksamer Antrag gestellt und wann ist er eingegangen?',
      'Der Antrag wirkt nach § 37 Abs. 2 SGB II grundsätzlich auf den Monatsersten zurück. Gilt das hier in der maßgeblichen Fassung ohne Besonderheiten?',
      'Welche Dauer des Bewilligungszeitraums ist nach § 41 Abs. 3 SGB II angezeigt (Regelfall oder Verkürzung)?',
    ];
    const hints = [];
    if (validDate(v.applicationDate) && v.kind === 'erst') hints.push(`Rechnerischer Hinweis: Antragseingang ${v.applicationDate}, Monatserster ${firstOfMonth(v.applicationDate)}. Keine Entscheidung.`);
    push({ id: 'antrag', title: v.kind === 'wba' ? 'Weiterbewilligungsantrag und neuer Zeitraum' : 'Antrag und Bewilligungszeitraum', facts: antragFacts, questions: q1, hints, norms: ['sgb2_37', 'sgb2_41'] });

    const bgFacts = [fact('adultCount'), fact('childCount'), ...(num(v.childCount) ? [fact('childAges')] : [])];
    const bgQ = ['Wer gehört zur Bedarfsgemeinschaft und wer lebt nur im Haushalt?'];
    if (d.ages.some((a) => a >= 15)) bgQ.push('Ein Kind ist mindestens 15 Jahre alt: eigene Erwerbsfähigkeit und eigener Leistungsanspruch nach § 7 Abs. 1 SGB II prüfen.');
    if (d.ages.some((a) => a >= 18 && a < 25)) bgQ.push('Ein Kind ist zwischen 18 und 24 Jahre alt: Zugehörigkeit zur Bedarfsgemeinschaft nach § 7 Abs. 3 Nr. 4 SGB II prüfen.');
    if (d.ages.some((a) => a >= 25)) bgQ.push('Ein Kind ist mindestens 25 Jahre alt: gehört nicht als Kind zur Bedarfsgemeinschaft der Eltern; eigene Bedarfsgemeinschaft prüfen.');
    if (num(v.adultCount) === 2) bgQ.push('Zwei Erwachsene: Partnerschaft oder Einstandsgemeinschaft nach § 7 Abs. 3 SGB II tatsächlich feststellen.');
    push({ id: 'bg', title: 'Bedarfsgemeinschaft und Haushalt', facts: bgFacts, questions: bgQ, norms: ['sgb2_7'] });

    if (num(v.adultCount) === 1 && num(v.childCount) > 0) {
      push({ id: 'mehrbedarf', title: 'Mehrbedarf bei Alleinerziehung', facts: [fact('adultCount'), fact('childCount'), fact('childAges')], questions: ['Sorgt die Person tatsächlich allein für Pflege und Erziehung? Nicht allein aus dem Wohnsitz des Kindes ableiten.', 'Gibt es ein Wechselmodell oder regelmäßige Betreuung durch den anderen Elternteil?', 'Höhe nach Zahl und Alter der Kinder gemäß § 21 Abs. 3 SGB II in der geltenden Fassung bestimmen.'], norms: ['sgb2_21'] });
    }

    if (d.hasHousing || v.kind === 'erst') {
      const hq = [
        'Tatsächliche Aufwendungen belegen: Nettokaltmiete, kalte Nebenkosten und Heizkosten getrennt feststellen.',
        'Ob und wie eine Karenzzeit für die Unterkunftskosten gilt, nach der für den Zeitraum geltenden Fassung des § 22 SGB II prüfen. Gesetzesänderungen beachten.',
        'Angemessenheit nach den örtlichen Vorgaben des zuständigen Trägers prüfen. Die App kennt keine Mietobergrenzen.',
        'Heizkosten gesondert auf Angemessenheit prüfen.',
      ];
      if (d.bkk !== null && num(v.bkk) === null) hq.unshift(`Rechnerisch: Nettokaltmiete + Nebenkosten = ${money(d.bkk)}.`);
      push({ id: 'kdu', title: 'Unterkunft und Heizung', facts: [fact('netCold'), fact('opCosts'), fact('bkk'), fact('heat'), fact('warm'), fact('area'), fact('heating'), fact('city')], questions: hq, norms: ['sgb2_22', 'local_re'] });
    }
    if (d.hasHousing) {
      push({ id: 'warmwasser', title: 'Warmwasserbereitung', facts: [fact('water'), fact('heating')], questions: ['Wird das Warmwasser zentral über die Heizung oder dezentral erzeugt?', 'Bei dezentraler Erzeugung Mehrbedarf nach § 21 Abs. 7 SGB II prüfen; bei zentraler Erzeugung Teil der Heizkosten (§ 22 SGB II).'], norms: ['sgb2_21', 'sgb2_22'] });
    }

    const incFacts = [fact('incomeType'), fact('currentIncome')];
    if (num(v.childCount) > 0) incFacts.push(fact('childBenefit'), fact('maintenance'));
    if (v.childBenefit === 'yes') incFacts.push(fact('childBenefitAmount'));
    if (v.maintenance === 'yes') incFacts.push(fact('maintenanceAmount'));
    const iq = ['Welche Einnahmen fließen in welchem Monat tatsächlich zu (Zuflussprinzip, § 11 SGB II)?', 'Sind Einnahmen nach § 11a SGB II nicht zu berücksichtigen?', 'Welche Absetzbeträge nach § 11b SGB II kommen in Betracht? Keine pauschale Anrechnung.'];
    if (num(v.childCount) > 0) iq.push('Kindergeld und Unterhalt den richtigen Personen zuordnen (§ 11 Abs. 1 SGB II).');
    push({ id: 'einkommen', title: 'Einkommen und Familienleistungen', facts: incFacts.map((f) => (f.key === 'incomeType' ? { ...f, known: v.incomeType !== 'unknown' } : ['childBenefit', 'maintenance'].includes(f.key) ? { ...f, known: v[f.key] !== 'unknown' } : f)), questions: iq, norms: ['sgb2_11', 'sgb2_11a', 'sgb2_11b'] });

    if (v.kind === 'erst') push({ id: 'vermoegen', title: 'Vermögen', facts: [], questions: ['Vermögensangaben aus dem Antrag prüfen. Freibeträge und eine etwaige Karenzzeit nach der geltenden Fassung des § 12 SGB II bestimmen.', 'Nur fehlende Angaben nachfordern; keine pauschale Anforderung aller Kontoauszüge.'], norms: ['sgb2_12', 'sgb2_9'], severity: 'hinweis' });
    if (num(v.childCount) > 0) push({ id: 'but', title: 'Bildung und Teilhabe', facts: [fact('childAges')], questions: ['Besuchen Kinder Kita oder Schule? Bedarfe nach § 28 SGB II ansprechen.'], norms: ['sgb2_28'], severity: 'hinweis' });

    if (v.kind === 'wba') {
      const rows = compareWba(v);
      const changed = rows.filter((r) => r.status === 'gestiegen' || r.status === 'gesunken').map((r) => `${r.label}: ${r.status} (${r.kind === 'money' ? money(r.prev) + ' → ' + money(r.curr) : r.prev + ' → ' + r.curr})`);
      const unknown = rows.filter((r) => r.status === 'unbekannt').map((r) => r.label);
      push({ id: 'wba', title: 'Änderungen gegenüber dem bisherigen Zeitraum', facts: [fact('previousBkk'), fact('previousHeat'), fact('previousIncome'), fact('previousPersons')], questions: [...changed.map((c) => `Änderung prüfen – ${c}`), ...(unknown.length ? [`Vergleich unvollständig: ${unknown.join(', ')}. Fehlende Werte gelten als unbekannt, nicht als 0.`] : []), 'Neue Anspruchsvoraussetzungen für den neuen Zeitraum vollständig prüfen, nicht nur Änderungen.'], norms: ['sgb2_37', 'sgb2_41'] });
      if (v.priorDecision === 'provisional') push({ id: 'abschluss41a', title: 'Abschluss des bisherigen vorläufigen Zeitraums (§ 41a)', facts: [fact('priorDecision')], questions: ['Eigener Vorgang: abschließende Entscheidung für den abgelaufenen Zeitraum nach § 41a SGB II, getrennt vom Weiterbewilligungsantrag.', 'Tatsächliche Einnahmen des abgelaufenen Zeitraums feststellen und Fristen in der geltenden Fassung beachten.'], norms: ['sgb2_41a'] });
      else if (v.priorDecision === 'unknown') push({ id: 'abschluss41a', title: 'Art der bisherigen Bewilligung klären', facts: [fact('priorDecision')], questions: ['War die bisherige Bewilligung vorläufig? Falls ja, ist der Abschluss nach § 41a SGB II ein eigener Vorgang.'], norms: ['sgb2_41a'] });
    }
    return list;
  }

  /* ------------------------------------------------------------------ *
   * Unterlagen: nur fallbezogen und verhältnismäßig                     *
   * ------------------------------------------------------------------ */
  function documents(v) {
    const d = derived(v);
    const out = [];
    const add = (o) => out.push({ optional: false, group: 'main', ...o });
    const kids = num(v.childCount) > 0;
    if (d.hasHousing) {
      const splitMissing = num(v.netCold) === null || num(v.opCosts) === null || (num(v.heat) === null && num(v.warm) === null);
      add({ id: 'rent', heading: 'Mietvertrag oder Mietbescheinigung', why: splitMissing ? 'Aufteilung in Nettokaltmiete, Nebenkosten und Heizkosten ist noch nicht vollständig bekannt.' : 'Die angegebenen Mietkosten sind bisher nur Angaben im Sachverhalt und noch nicht belegt.', letter: 'Eine Unterlage, aus der die aktuellen Unterkunftskosten aufgeschlüsselt nach Nettokaltmiete, kalten Nebenkosten und Heizkosten hervorgehen, zum Beispiel Mietvertrag oder Mietbescheinigung.', rule: '§ 22 SGB II' });
    }
    if (d.heat !== null) add({ id: 'abschlag', heading: 'Nachweis der aktuellen Heizkostenvorauszahlung', why: 'Höhe und Energieträger der laufenden Heizkosten sind zu belegen.', letter: 'Einen Nachweis über die Höhe der aktuell zu zahlenden Heizkostenvorauszahlung, zum Beispiel Abschlagsplan des Energieversorgers oder Vermieterschreiben.', rule: '§ 22 SGB II' });
    if (d.heat !== null) add({ id: 'heizabrechnung', optional: true, heading: 'Letzte Heizkostenabrechnung', why: 'Nur falls für die Angemessenheitsprüfung der Heizkosten erforderlich. Standardmäßig nicht angefordert.', letter: 'Die letzte vorliegende Heizkostenabrechnung, soweit vorhanden.', rule: '§ 22 SGB II' });
    if (d.hasHousing && v.water === 'unknown') add({ id: 'warmwasser', heading: 'Angabe zur Warmwasserbereitung', why: 'Ob Warmwasser zentral oder dezentral erzeugt wird, ist offen. Eine einfache Angabe genügt.', letter: 'Eine kurze Angabe, ob das Warmwasser über die Heizung (zentral) oder zum Beispiel über einen Durchlauferhitzer (dezentral) erzeugt wird.', rule: '§§ 21, 22 SGB II' });
    if (kids && v.childBenefit === 'unknown') add({ id: 'kindergeld', heading: 'Angaben zum Kindergeld', why: 'Ob und in welcher Höhe Kindergeld bezogen wird, ist ungeklärt.', letter: 'Angaben dazu, ob für die im Haushalt lebenden Kinder Kindergeld bezogen wird, und gegebenenfalls einen Nachweis über dessen Höhe.', rule: '§ 11 SGB II' });
    else if (kids && v.childBenefit === 'yes' && num(v.childBenefitAmount) === null) add({ id: 'kindergeld', heading: 'Nachweis zur Höhe des Kindergeldes', why: 'Bezug ist angegeben, die Höhe fehlt.', letter: 'Einen Nachweis über die Höhe des bezogenen Kindergeldes, zum Beispiel Kindergeldbescheid oder Kontoauszug mit der Zahlung.', rule: '§ 11 SGB II' });
    if (kids && v.maintenance === 'unknown') add({ id: 'unterhalt', heading: 'Angaben zu Unterhalt oder Unterhaltsvorschuss', why: 'Ob Unterhalt oder Unterhaltsvorschuss gezahlt wird, ist ungeklärt.', letter: 'Angaben dazu, ob für die Kinder Unterhalt oder Unterhaltsvorschuss gezahlt wird, und gegebenenfalls einen Nachweis über die Höhe.', rule: '§ 11 SGB II' });
    else if (kids && v.maintenance === 'yes' && num(v.maintenanceAmount) === null) add({ id: 'unterhalt', heading: 'Nachweis zur Höhe des Unterhalts', why: 'Bezug ist angegeben, die Höhe fehlt.', letter: 'Einen Nachweis über die Höhe der Unterhaltszahlungen oder des Unterhaltsvorschusses.', rule: '§ 11 SGB II' });
    const hasIncome = num(v.currentIncome) !== null || ['employment', 'minijob', 'selfemployed', 'other'].includes(v.incomeType);
    if (v.incomeType === 'selfemployed') add({ id: 'income', heading: 'Angaben zum Einkommen aus Selbstständigkeit', why: 'Einnahmen und Ausgaben aus selbstständiger Tätigkeit sind festzustellen.', letter: 'Eine Aufstellung der voraussichtlichen monatlichen Einnahmen und Ausgaben aus der selbstständigen Tätigkeit für den Bewilligungszeitraum.', rule: '§§ 11 bis 11b SGB II' });
    else if (hasIncome) add({ id: 'income', heading: 'Nachweise über aktuelles Einkommen', why: num(v.currentIncome) !== null ? 'Einkommen ist angegeben, Zufluss und Abzüge sind nicht belegt.' : 'Eine Beschäftigung ist beschrieben, die Höhe ist offen.', letter: 'Nachweise über die aktuellen Einnahmen mit Angabe des Zuflusszeitpunkts, zum Beispiel Lohn- oder Gehaltsabrechnungen der letzten Monate.', rule: '§§ 11 bis 11b SGB II' });

          ${moneyField('Vermögen gesamt', 'assets', 'Konto, Sparbuch usw. Ein angemessenes Auto zählt nicht.', 'optional')}
          ${s.kind === 'wba' ? `${moneyField('Bisheriger Anspruch', 'previous', 'Zum Vergleich', 'optional')}
          <div class="f"><span class="label">Bisherige Bewilligung</span><div class="chips"><button type="button" class="chip" data-action="prior" data-v="final" ${pressed(s.priorDecision === 'final')}>Endgültig</button><button type="button" class="chip" data-action="prior" data-v="provisional" ${pressed(s.priorDecision === 'provisional')}>Vorläufig</button></div></div>` : ''}

  }

  /* ---------------- Ergebnis ---------------- */
  const W10 = (v, max) => `w${Math.max(1, Math.min(100, Math.round((v / max) * 100)))}`;
  function bar(parts, max) {
    return `<div class="bar">${parts.filter((p) => p.v > 0).map((p) => `<span class="${p.c} ${W10(p.v, max)}" title="${esc(p.t)}: ${esc(fmt(p.v))}"></span>`).join('')}</div>`;
  }
  const tabBtn = (id, label, badge) => `<button type="button" role="tab" aria-selected="${s.tab === id}" data-action="tab" data-v="${id}">${label}${badge !== '' && badge !== undefined ? ` <span class="count ${badge ? '' : 'zero'}">${badge}</span>` : ''}</button>`;
  const STATES = [['fehlt', 'Fehlt'], ['vorhanden', 'Liegt vor'], ['entfaellt', 'Entfällt']];
  function tabsHTML(items, missing, todoList, todoOpen) {
    if (s.tab === 'check') {
      const groups = [...new Set(items.map((i) => i.group))];

        ${groups.map((g) => `<div class="section-label">${esc(g)}</div><div class="checks">${items.filter((i) => i.group === g).map((i) => {
          const st = K.stateOf(i, s.check);
          return `<div class="check st-${st}"><div class="check-text"><b>${esc(i.title)}</b><small>${esc(i.why)} <span class="norm">${esc(i.norm)}</span></small></div>
            <div class="tri" role="group" aria-label="${esc(i.title)}">${STATES.map(([v, l]) => `<button type="button" data-action="check" data-id="${i.id}" data-v="${v}" aria-pressed="${st === v}">${l}</button>`).join('')}</div></div>`;
        }).join('')}</div>`).join('')}
        <div class="letter-box">
          <h3>Zwischenmitteilung an den Kunden</h3>

            <div class="f"><label for="i_deadline">Frist bis</label><input id="i_deadline" data-bind="deadline" data-date inputmode="numeric" maxlength="10" value="${esc(s.deadline)}" placeholder="TT.MM.JJJJ"></div>
            <div class="f"><label for="i_appDate">Antrag vom</label><input id="i_appDate" data-bind="appDate" data-date inputmode="numeric" maxlength="10" value="${esc(s.appDate)}" placeholder="TT.MM.JJJJ (optional)"></div>
