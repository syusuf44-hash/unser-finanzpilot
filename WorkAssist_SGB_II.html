          <div class="btn-row row-gap"><button type="button" class="btn primary" data-action="wordLetter" ${missing ? '' : 'disabled'}>${ICON.doc} Zwischenmitteilung als Word</button><button type="button" class="btn ghost" data-action="copyLetter" ${missing ? '' : 'disabled'}>${ICON.copy} Kopieren</button></div>
          ${missing ? `<details class="more"><summary>Vorschau</summary><div><pre class="preview">${esc(letterText())}</pre></div></details>` : '<div class="hint row-gap">Alle Unterlagen liegen vor. Keine Zwischenmitteilung nötig.</div>'}
        </div>
        ${s.kind === 'wba' && s.priorDecision === 'provisional' ? `<div class="letter-box warnbox">
          <h3>Eigener Vorgang: Abschluss nach § 41a SGB II</h3>
          <p class="hint">Nachweise für den abgelaufenen vorläufigen Zeitraum werden mit eigenem Schreiben und eigener Belehrung nach § 41a Abs. 3 angefordert, nicht in der Zwischenmitteilung.</p>
          <div class="grid">
            <div class="f"><label for="i_a41From">Vorläufig bewilligt ab</label><input id="i_a41From" data-bind="a41From" data-date inputmode="numeric" maxlength="10" value="${esc(s.a41From)}" placeholder="TT.MM.JJJJ"></div>
            <div class="f"><label for="i_a41To">bis</label><input id="i_a41To" data-bind="a41To" data-date inputmode="numeric" maxlength="10" value="${esc(s.a41To)}" placeholder="TT.MM.JJJJ"></div>
          </div>
          <div class="btn-row row-gap"><button type="button" class="btn primary" data-action="word41a">${ICON.doc} Nachweisanforderung § 41a als Word</button><button type="button" class="btn ghost" data-action="copy41a">${ICON.copy} Kopieren</button></div>
        </div>` : ''}
      </div>`;
    }
    if (s.tab === 'todo') {
      return `<div class="card" id="tab-todo" role="tabpanel">
        <div class="card-head tight"><h2>Was ist zu tun?</h2><span class="sub">${todoOpen} offen</span></div>
        <div class="todos">${todoList.map((x) => `<label class="todo ${s.done[x.id] ? 'done' : ''} ${x.prio === 'hoch' ? 'prio' : ''}"><input type="checkbox" data-todo="${x.id}" ${s.done[x.id] ? 'checked' : ''}><span>${esc(x.text)} <span class="norm">${esc(x.norm)}</span></span></label>`).join('')}</div>
        <div class="btn-row row-gap"><button type="button" class="btn" data-action="wordCalc">${ICON.doc} Berechnung als Word</button><button type="button" class="btn ghost" data-action="copyTodos">${ICON.copy} Aufgaben kopieren</button></div>
      </div>`;
    }
    return '';
  }
  function renderResult() {
    const r = W.compute(input());
    const box = $('#result');
    if (r.empty) { box.innerHTML = '<div class="card empty-state">Bitte Haushalt erfassen.</div>'; return; }
    const t = r.totals;
    const touched = W.parseDE(s.housing.rent) !== null || s.children.length || s.adults.some((a) => a.net || a.other);
    const claim = t.claim;
    const inc = W.r2(t.income + t.childIncome);
    const max = Math.max(t.bedarf, inc, 1);
    const items = checkItems();
    const missing = items.filter((i) => K.stateOf(i, s.check) === 'fehlt').length;
    const todoList = K.todos(checkInput(), r, missing);
    const todoOpen = todoList.filter((x) => !s.done[x.id]).length;
    const delta = t.delta !== undefined ? `<span class="delta">${t.delta === 0 ? 'unverändert' : `${t.delta > 0 ? '+' : '−'}${fmt(Math.abs(t.delta))} ggü. bisher`}</span>` : '';
    const notes = [...r.warnings.map((w) => `<div class="note warn">${esc(w)}</div>`), ...r.hints.map((w) => `<div class="note">${esc(w)}</div>`)];
    if (s.kind === 'wba' && s.priorDecision === 'provisional') notes.push('<div class="note warn">Bisher vorläufig bewilligt: Abschluss nach § 41a SGB II ist ein eigener Vorgang.</div>');
    const rows = r.persons.map((p) => `<tr class="${p.inBG ? '' : 'out'}"><td>${esc(p.label)}</td><td>${p.bedarf ? fmt(p.bedarf) : '–'}</td><td>${fmt(p.income || 0)}</td><td>${p.inBG ? fmt(p.claim) : '–'}</td></tr>`).join('');
    box.innerHTML = `
      <div class="hero ${claim > 0 || !touched ? '' : 'none'}">
        <div class="k">${claim > 0 || !touched ? 'Voraussichtlicher Anspruch' : 'Kein Anspruch nach SGB II'}</div>
        <div class="amount" id="claim">${fmt(claim)} <small>/ Monat</small></div>
        <div class="meta"><span>Bedarf ${fmt(t.bedarf)}</span><span>Einkommen ${fmt(inc)}</span>${t.surplus ? `<span>Überschuss ${fmt(t.surplus)}</span>` : ''}</div>
        ${delta}
      </div>
      <div class="tabs" role="tablist" aria-label="Ergebnisbereiche">${tabBtn('calc', 'Berechnung', '')}${tabBtn('check', 'Unterlagen', missing)}${tabBtn('todo', 'Aufgaben', todoOpen)}</div>
      <div class="card ${s.tab === 'calc' ? '' : 'hidden'}" id="tab-calc" role="tabpanel">
        <div class="bars">
          <div class="bar-row"><span>Bedarf</span>${bar([{ v: t.rb, c: 'c-rb', t: 'Regelbedarf' }, { v: t.mb, c: 'c-mb', t: 'Mehrbedarf' }, { v: t.bedarf - t.rb - t.mb, c: 'c-kdu', t: 'Unterkunft' }], max)}<span class="v">${fmt(t.bedarf)}</span></div>
          <div class="bar-row"><span>Einkommen</span>${bar([{ v: inc, c: 'c-inc', t: 'Einkommen' }], max)}<span class="v">${fmt(inc)}</span></div>
          <div class="bar-row"><span>Anspruch</span>${bar([{ v: claim, c: 'c-claim', t: 'Anspruch' }], max)}<span class="v">${fmt(claim)}</span></div>
        </div>
        <div class="legend"><span><i class="c-rb"></i>Regelbedarf ${fmt(t.rb)}</span><span><i class="c-mb"></i>Mehrbedarf ${fmt(t.mb)}</span><span><i class="c-kdu"></i>Unterkunft ${fmt(t.kdu)}</span></div>
        <table class="t row-gap"><thead><tr><th>Person</th><th>Bedarf</th><th>Einkommen</th><th>Anspruch</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Gesamt</td><td>${fmt(t.bedarf)}</td><td>${fmt(inc)}</td><td>${fmt(claim)}</td></tr></tfoot></table>
        <details class="more"><summary>Rechenweg anzeigen</summary><div><ol class="steps">${r.steps.map((x) => `<li>${esc(x.text)} <span class="norm">${esc(x.norm)}</span></li>`).join('')}</ol></div></details>
        <div class="btn-row row-gap"><button type="button" class="btn" data-action="wordCalc">${ICON.doc} Berechnung als Word</button><button type="button" class="btn ghost" data-action="copyCalc">${ICON.copy} Kopieren</button></div>
      </div>
      ${s.tab === 'calc' && missing ? `<button type="button" class="cta" data-action="tab" data-v="check"><span><b>${missing} Unterlage${missing > 1 ? 'n' : ''} fehlen</b><small>Checkliste prüfen und Zwischenmitteilung erstellen</small></span><span aria-hidden="true">→</span></button>` : ''}
      ${notes.length && s.tab === 'calc' ? `<div class="notes">${notes.join('')}</div>` : ''}
      ${tabsHTML(items, missing, todoList, todoOpen)}
      <p class="foot">Prüfhilfe für fiktive Fälle, kein Bescheid. Werte ${r.R.year}: ${esc(r.R.source)}. Vor Verwendung Rechtsstand und örtliche Richtlinien prüfen, insbesondere Änderungen durch die Reform zur Grundsicherung. Keine Speicherung, keine Übertragung.</p>`;
    $('#mobileBar').innerHTML = `<span>${claim > 0 || !touched ? 'Anspruch / Monat' : 'Kein Anspruch'}</span><b>${fmt(claim)}</b>`;
  }
  function renderTop() {
    $('#topActions').innerHTML = `<button type="button" class="btn ghost small" data-action="theme" aria-label="Hell oder dunkel">${ICON.moon}</button><button type="button" class="btn small" data-action="reset">Neuer Fall</button>`;
  }
  function render() { renderForm(); renderResult(); }

  /* ---------------- Texte für Word ---------------- */
  function calcText() {
    const r = W.compute(input());
    if (r.empty) return '';
    const t = r.totals;
    const lines = [`Berechnungsübersicht SGB II (Prüfhilfe, Leistungsjahr ${r.R.year})`, ''];
    r.steps.forEach((x, i) => lines.push(`${i + 1}. ${x.text} (${x.norm})`));
    lines.push('', `Gesamtbedarf: ${fmt(t.bedarf)}`, `Anrechenbares Einkommen: ${fmt(t.income + t.childIncome)}`, `Voraussichtlicher Anspruch: ${fmt(t.claim)} monatlich`);
    if (r.warnings.length) lines.push('', 'Hinweise:', ...r.warnings.map((w) => `- ${w}`));
    lines.push('', 'Rechnerische Prüfhilfe, kein Bescheid. Maßgeblich sind die im Leistungszeitraum geltende Rechtslage und die örtlichen Richtlinien.');
    return lines.join('\n');
  }

  /* ---------------- Text-Import ---------------- */
  function importText() {
    if (!s.text.trim()) { flash('Bitte zuerst einen Text eingeben.'); return; }
    const res = C.extract(s.text);
    const f = Object.fromEntries(res.findings.map((x) => [x.key, x.value]));
    const filled = [];
    const set = (path, v) => { if (v !== undefined && v !== null && v !== '' && v !== 'NaN') { setPath(path, String(v)); filled.push(path); } };
    if (f.adultCount) s.single = Number(f.adultCount) < 2;
    if (f.kind) s.kind = f.kind;
    if (f.childAges || f.childCount) {
      const ages = (f.childAges || '').split(',').map((x) => x.trim()).filter(Boolean);
      const count = Math.max(Number(f.childCount || 0), ages.length);
      s.children = Array.from({ length: count }, (_, i) => ({ age: ages[i] && ages[i] !== '?' ? ages[i] : '', kg: f.childBenefit !== 'no', maintenance: '' }));
      s.children.forEach((_, i) => filled.push(`children.${i}.age`));
    }
    const p = W.parseDE;
    const rent = f.bkk ?? (f.netCold && f.opCosts ? W.r2(p(f.netCold) + p(f.opCosts)) : f.warm && f.heat ? W.r2(p(f.warm) - p(f.heat)) : undefined);
    set('housing.rent', rent);
    set('housing.heat', f.heat ?? (f.warm && f.bkk ? W.r2(p(f.warm) - p(f.bkk)) : undefined));
    if (f.water) s.housing.ww = f.water;
    set('adults.0.net', f.currentIncome);
    const gross = s.text.match(/brutto\s+(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+)\s*(?:€|euro)/i) || s.text.match(/(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+)\s*(?:€|euro)\s+brutto/i);
    if (gross && f.currentIncome) set('adults.0.gross', gross[1]);
    if (f.maintenanceAmount && s.children.length === 1) set('children.0.maintenance', f.maintenanceAmount);
    if (f.periodStart || f.applicationDate) { const y = Number((f.periodStart || f.applicationDate).slice(-4)); if (W.YEARS.includes(y)) s.year = y; }
    s.housing.phase = s.kind === 'wba' ? 'grenze' : 'karenz';
    render();
    filled.forEach((x) => { const el = document.getElementById(`i_${x}`); if (el) el.classList.add('flash'); });
    flash(res.findings.length ? `${res.findings.length} Angaben übernommen. Bitte kurz prüfen.` : 'Nichts erkannt. Bitte Felder direkt ausfüllen.');
  }

  /* ---------------- Download, Dialog, Kopieren ---------------- */
  let downloadsApi = null;
  try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then((d) => { downloadsApi = d; }).catch(() => {}); } catch (_) { /* lokal */ }
  async function saveDocx(text, name) {
    const blob = new Blob([C.makeDocx(text)], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    if (downloadsApi) {
      try { await downloadsApi.save({ filename: name, data: blob }); flash('Word-Datei gespeichert.'); return; }
      catch (e) { if (e && e.code === 'declined') { flash('Abgebrochen.'); return; } }
    }
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url; a.download = name; a.className = 'sr-only';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    flash('Word-Datei erstellt.');
  }
  function ask(message, okLabel) {
    return new Promise((resolve) => {
      const prev = document.activeElement;
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="askMsg"><p id="askMsg">${esc(message)}</p><div class="btn-row"><button type="button" class="btn" data-ask="no">Abbrechen</button><button type="button" class="btn primary" data-ask="yes">${esc(okLabel)}</button></div></div>`;
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); done(false); }
        if (e.key === 'Tab') { const b = $$('button', wrap); const i = b.indexOf(document.activeElement); e.preventDefault(); b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length].focus(); }
      };
      const done = (v) => { wrap.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus) prev.focus({ preventScroll: true }); resolve(v); };
      wrap.addEventListener('click', (e) => { const b = e.target.closest('[data-ask]'); if (b) { e.stopPropagation(); done(b.dataset.ask === 'yes'); } else if (e.target === wrap) done(false); });
      document.addEventListener('keydown', onKey, true);
      document.body.appendChild(wrap);
      $('[data-ask="yes"]', wrap).focus();
    });
  }
  async function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return; }
    const ta = document.createElement('textarea'); ta.value = t; ta.className = 'sr-only'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); if (!ok) throw new Error('copy');
  }

  /* ---------------- Aktionen ---------------- */
  const today = () => C.todayDE().replace(/\./g, '-');
  const actions = {
    single: (el) => { s.single = el.dataset.v === '1'; render(); },
    kids: (el) => {
      const add = Number(el.dataset.d) > 0;
      if (add) s.children.push({ age: '', kg: true, maintenance: '' }); else s.children.pop();
      render();
      if (add) { const f = document.getElementById(`i_children.${s.children.length - 1}.age`); if (f) f.focus(); }
    },
    removeKid: (el) => { s.children.splice(Number(el.dataset.i), 1); render(); },
    ww: (el) => { s.housing.ww = el.dataset.v; render(); },
    kind: (el) => { s.kind = el.dataset.v; s.housing.phase = s.kind === 'erst' ? 'karenz' : 'grenze'; render(); },
    phase: (el) => { s.housing.phase = el.dataset.v; render(); },
    prior: (el) => { s.priorDecision = s.priorDecision === el.dataset.v ? 'unknown' : el.dataset.v; render(); },
    importText: () => importText(),
    sample: async (el) => {
      if (hasData() && !(await ask('Aktuellen Fall verwerfen und Beispiel laden?', 'Beispiel laden'))) return;
      s = fresh(); s.text = SAMPLES[el.dataset.k]; importText();
    },
    tab: (el) => { s.tab = el.dataset.v; renderResult(); const t = document.querySelector(`[data-action="tab"][data-v="${s.tab}"]`); if (t && el.closest('.tabs')) t.focus(); },
    check: (el) => { s.check[el.dataset.id] = el.dataset.v; renderResult(); },
    word41a: () => saveDocx(K.letter41a({ from: s.a41From, to: s.a41To, deadline: s.deadline, frame: s.frame }), `Nachweisanforderung_41a_${today()}.docx`),
    copy41a: async () => { try { await copyText(K.letter41a({ from: s.a41From, to: s.a41To, deadline: s.deadline, frame: s.frame })); flash('Text kopiert.'); } catch (_) { flash('Kopieren nicht möglich.'); } },
    wordLetter: () => {
      if (!C.validDate(s.deadline)) { flash('Bitte eine gültige Frist im Format TT.MM.JJJJ eintragen.'); return; }
      const t = letterText();
      if (!t.trim()) { flash('Keine fehlenden Unterlagen.'); return; }
      saveDocx(t, `Zwischenmitteilung_${today()}.docx`);
    },
    copyLetter: async () => { try { await copyText(letterText()); flash('Zwischenmitteilung kopiert.'); } catch (_) { flash('Kopieren nicht möglich.'); } },
    copyTodos: async () => { try { await copyText(K.todos(checkInput(), W.compute(input()), missingItems().length).map((x) => `[${s.done[x.id] ? 'x' : ' '}] ${x.text} (${x.norm})`).join('\n')); flash('Aufgaben kopiert.'); } catch (_) { flash('Kopieren nicht möglich.'); } },
    wordCalc: () => saveDocx(calcText(), `Berechnung_SGB_II_${today()}.docx`),
    copyCalc: async () => { try { await copyText(calcText()); flash('Berechnung kopiert.'); } catch (_) { flash('Kopieren nicht möglich.'); } },
    theme: () => {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
    },
    reset: async () => { if (!hasData() || await ask('Alle Angaben verwerfen und neuen Fall beginnen?', 'Neuer Fall')) { s = fresh(); render(); window.scrollTo({ top: 0 }); flash('Neuer Fall.'); } },
    toResult: () => $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' }),
  };

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-action]');
    if (a && actions[a.dataset.action]) { e.preventDefault(); actions[a.dataset.action](a); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'caseText') { s.text = t.value; $('#privacy').innerHTML = privacyHTML(); return; }
    if (t.matches('[data-bind]') && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
      let v = t.value;
      if (t.hasAttribute('data-int')) { v = v.replace(/\D/g, '').slice(0, 2); if (v !== t.value) t.value = v; }
      setPath(t.dataset.bind, v);
      if (t.hasAttribute('data-date')) { t.classList.toggle('invalid', v.length >= 10 && !C.validDate(v)); return; }
      t.classList.toggle('invalid', !!(v.trim() && !t.hasAttribute('data-int') && W.parseDE(v) === null));
      renderResult();
    }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-bind]') && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
      setPath(t.dataset.bind, t.type === 'checkbox' ? t.checked : (t.hasAttribute('data-num') ? Number(t.value) : t.value));
      const bind = t.dataset.bind;
      if (t.closest('#result')) renderResult(); else render();
      const again = document.querySelector(`[data-bind="${bind}"]`);
      if (again) again.focus({ preventScroll: true });
      return;
    }
    if (t.matches('[data-todo]')) { s.done[t.dataset.todo] = t.checked; t.closest('.todo').classList.toggle('done', t.checked); return; }
    if (t.matches('[data-date]')) { const v = C.normalizeDate(t.value); t.value = v; setPath(t.dataset.bind, v); t.classList.toggle('invalid', !!v && !C.validDate(v)); }
  });
  document.addEventListener('keydown', (e) => { if (e.target.id === 'caseText' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); importText(); } });
  window.addEventListener('beforeunload', (e) => { if (hasData()) { e.preventDefault(); e.returnValue = ''; } });
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((en) => { $('#mobileBar').classList.toggle('hide', en.some((x) => x.isIntersecting)); }, { threshold: 0.05 });
    io.observe($('#result'));
  }

  renderTop();
  render();
  window.WAApp = {
    render, esc, flash, saveDocx, copyText, ICON, today,
    setKind: (k) => { s.kind = k; s.housing.phase = k === 'erst' ? 'karenz' : 'grenze'; },
  };
  window.__WA_STATE__ = () => JSON.parse(JSON.stringify(s));
  window.__WA_RESULT__ = () => W.compute(input()).totals;
})();

</script>
  <script>
/*
 * Startseite, Prüfschemata je Vorgang, Fristenrechner, Vorlagen und Übungsmodus.
 * Alles nur im Arbeitsspeicher dieser Seite. Keine Speicherung, keine Übertragung.
 */
(() => {
  'use strict';
  const A = window.WAApp, F = window.WAFristen, VL = window.WAVorlagen, VG = window.WAVorgaenge, K = window.WACheck, C = window.WACore;
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = A.esc;
  const TYPE = { T: ['Tatsache', 'tt'], W: ['Würdigung', 'tw'], H: ['Handlung', 'th'] };
  const NAV = [['start', 'Start'], ['rechner', 'Rechner'], ['fristen', 'Fristen'], ['vorlagen', 'Vorlagen'], ['uebung', 'Übung']];
  const st = { view: 'start', vorgang: null, done: {}, notes: {}, fr: {}, vlId: 'anhoerung', vl: {}, av: {}, ue: null, ueAns: {}, ueShown: false };
  const get = (path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), st);
  function set(path, val) { const ks = path.split('.'); const last = ks.pop(); let o = st; for (const k of ks) { if (o[k] == null) o[k] = {}; o = o[k]; } o[last] = val; }

  /* ---------- Bausteine ---------- */
  function field(path, label, type = 'date', opts) {
    const val = get(path);
    const id = `v_${path.replace(/\./g, '_')}`;
    if (type === 'bool') return `<label class="toggle"><input type="checkbox" data-vb="${path}" ${val === false ? '' : 'checked'}> ${esc(label)}</label>`;
    if (type === 'select') return `<div class="f"><label for="${id}">${esc(label)}</label><select id="${id}" data-vb="${path}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${val === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    if (type === 'text') return `<div class="f full"><label for="${id}">${esc(label)}</label><textarea id="${id}" data-vb="${path}" rows="3">${esc(val || '')}</textarea></div>`;
    const date = type === 'date';
    return `<div class="f"><label for="${id}">${esc(label)}</label><div class="${type === 'money' ? 'money' : ''}"><input id="${id}" data-vb="${path}" ${date ? 'data-vdate maxlength="10" placeholder="TT.MM.JJJJ" inputmode="numeric"' : type === 'num' || type === 'money' ? 'inputmode="decimal"' : ''} value="${esc(val ?? (opts !== undefined && type === 'num' ? opts : ''))}"></div></div>`;
  }
  function fristCard(id, prefix = 'fr') {
    const c = F.CALC[id];
    const base = `${prefix}.${id}`;
    if (get(base) == null) { const init = {}; c.fields.forEach(([k, , t, def]) => { if (def !== undefined) init[k] = def; }); set(base, init); }
    return `<div class="frist" data-frist="${id}" data-prefix="${prefix}"><div class="grid">${c.fields.map(([k, l, t, def]) => field(`${base}.${k}`, l, t === 'bool' ? 'bool' : t === 'num' ? 'num' : 'date', def)).join('')}</div><div class="frist-res" id="res_${prefix}_${id}">${fristResult(id, prefix)}</div></div>`;
  }
  function fristResult(id, prefix = 'fr') {
    const r = F.run(id, get(`${prefix}.${id}`));
    if (!r) return '<div class="hint">Datum eingeben (TT.MM.JJJJ).</div>';
    return `<table class="t frist-t"><tbody>${r.map((x) => `<tr><td>${esc(x.label)}<div class="hint">${esc(x.note)}</div></td><td><b>${esc(x.date)}</b><div class="hint">${esc(x.weekday)}</div></td><td><span class="norm">${esc(x.norm)}</span></td></tr>`).join('')}</tbody></table>`;
  }

  /* ---------- Seiten ---------- */
  function pageStart() {
    const tiles = Object.entries(VG.V).map(([k, v]) => `<button type="button" class="vtile" data-va="vorgang" data-v="${k}"><span class="vicon">${esc(v.icon)}</span><span><b>${esc(v.title)}</b><small>${esc(v.sub)}</small></span></button>`).join('');
    return `<section class="card intro"><h1>Was liegt vor Ihnen?</h1><p class="sub">Vorgangsart wählen. Jeder Vorgang führt Schritt für Schritt durch Tatsachen, Würdigung und Handlung, mit Normen, Fristen und Vorlagen.</p>
      <div class="vtiles">${tiles}</div></section>
      <section class="card"><div class="card-head"><h2>Werkzeuge</h2></div><div class="vtiles small">
        <button type="button" class="vtile" data-va="go" data-v="fristen"><span class="vicon">⏱</span><span><b>Fristenrechner</b><small>Widerspruch, § 41a, § 45, Karenzzeit …</small></span></button>
        <button type="button" class="vtile" data-va="go" data-v="vorlagen"><span class="vicon">✎</span><span><b>Vorlagen</b><small>Anhörung, Kostensenkung, Erinnerung …</small></span></button>
        <button type="button" class="vtile" data-va="go" data-v="uebung"><span class="vicon">◎</span><span><b>Übung Tagesplanung</b><small>Vorgänge richtig priorisieren</small></span></button></div></section>
      <section class="card"><div class="card-head"><h2>Reihenfolge am Arbeitstag</h2></div>
        <ol class="prio"><li><b>Heute, sofort:</b> Mittellosigkeit, Sperre, Räumung, ausgebliebene Zahlung, Eilverfahren, Fristablauf heute.</li><li><b>Diese Woche:</b> Weiterbewilligungen vor Ablauf, vollständige Erstanträge, Änderungen mit Wirkung auf die nächste Zahlung, Widersprüche, abgelaufene Mitwirkungsfristen.</li><li><b>Planbar mit Datum:</b> Abschluss § 41a, Überzahlungen, Nebenkostenabrechnungen, Datenabgleich, Erstattungsansprüche.</li><li><b>Rest:</b> Ablage, Nachfragen ohne Frist.</li></ol>
        <p class="hint">Grundsätze: Geld und Fristen zuerst · Zukunft vor Vergangenheit · jeder offene Vorgang hat eine Wiedervorlage · Gleichartiges bündeln · Tatsachen und Würdigung trennen · Amtsermittlung vor Mitwirkung (§ 20 SGB X).</p></section>`;
  }
  function pageVorgang() {
    const key = st.vorgang, v = VG.V[key];
    const done = st.done[key] || {}, notes = st.notes[key] || {};
    const n = v.steps.length, d = v.steps.filter((_, i) => done[i]).length;
    const steps = v.steps.map(([t, text, norm, frist, vorlage], i) => `<li class="vstep ${done[i] ? 'done' : ''}">
      <label class="vcheck"><input type="checkbox" data-vb="done.${key}.${i}" ${done[i] ? 'checked' : ''}><span class="badge ${TYPE[t][1]}">${TYPE[t][0]}</span></label>
      <div class="vbody"><p>${esc(text)} <span class="norm">${esc(norm)}</span></p>
        ${frist ? `<details class="more"><summary>Frist berechnen: ${esc(F.CALC[frist].title)}</summary><div>${fristCard(frist, `vf.${key}`)}</div></details>` : ''}
        ${vorlage ? `<button type="button" class="btn small" data-va="vorlage" data-v="${vorlage}">Vorlage öffnen: ${esc(vorlage === 'nachweis41a' ? 'Nachweise § 41a' : VL.T[vorlage].title)}</button>` : ''}
        <textarea class="vnote" data-vb="notes.${key}.${i}" rows="1" placeholder="${t === 'T' ? 'Festgestellte Tatsache, Beleg, Datum' : t === 'W' ? 'Würdigung / Ergebnis der Prüfung' : 'Erledigt am / Notiz'}">${esc(notes[i] || '')}</textarea></div></li>`).join('');
    return `<section class="card"><div class="card-head"><h2><button type="button" class="btn ghost small" data-va="go" data-v="start">← Start</button> ${esc(v.title)}</h2><span class="sub">${d} von ${n} erledigt</span></div>
      <div class="progress"><span class="w${Math.round((d / n) * 100) || 1}"></span></div>
      <p class="hint">Tatsache = feststellen und belegen · Würdigung = rechtlich einordnen · Handlung = veranlassen. Notizen bleiben nur in dieser Sitzung.</p>
      <ol class="vsteps">${steps}</ol></section>
      <section class="card"><div class="card-head"><h2>Aktenvermerk</h2><span class="sub">aus Ihren Notizen, ohne Namen</span></div>
        <div class="grid">${field(`av.${key}.wv`, 'Wiedervorlage am')}${field(`av.${key}.ergebnis`, 'Ergebnis / Entscheidung', 'text1')}</div>
        <div class="btn-row row-gap"><button type="button" class="btn primary" data-va="avWord">${A.ICON.doc} Aktenvermerk als Word</button><button type="button" class="btn ghost" data-va="avCopy">${A.ICON.copy} Kopieren</button></div></section>`;
  }
  function vermerkText() {
    const key = st.vorgang, v = VG.V[key], notes = st.notes[key] || {}, av = st.av[key] || {};
    const pick = (t) => v.steps.map((s, i) => [s, notes[i]]).filter(([s, n]) => s[0] === t && n && n.trim()).map(([s, n]) => `- ${n.trim()} (${s[2]})`).join('\n');
    return VL.render('aktenvermerk', { anlass: v.title, tatsachen: pick('T'), wuerdigung: pick('W'), ergebnis: [av.ergebnis, pick('H')].filter(Boolean).join('\n'), wv: av.wv });
  }
  function pageFristen() {
    return `<section class="card"><div class="card-head"><h2>Fristenrechner</h2><span class="sub">Feiertage NRW</span></div>
      <p class="hint">Fristende an Samstag, Sonntag oder Feiertag verschiebt sich auf den nächsten Werktag (§ 26 Abs. 3 SGB X, § 64 Abs. 3 SGG). Behördliche Ausschlussfristen werden ohne Verschiebung gezeigt: rechtzeitig vorher erledigen.</p></section>
      ${Object.entries(F.CALC).map(([id, c]) => `<section class="card"><div class="card-head tight"><h2>${esc(c.title)}</h2></div>${fristCard(id)}</section>`).join('')}`;
  }
  const VL_LIST = () => [...Object.entries(VL.T).map(([k, t]) => [k, t.title]), ['nachweis41a', 'Nachweise § 41a (eigenes Schreiben)']];
  function vorlageText() {
    const f = st.vl[st.vlId] || {};
    if (st.vlId === 'nachweis41a') return K.letter41a({ from: f.von, to: f.bis, deadline: f.frist, frame: false });
    return VL.render(st.vlId, f);
  }
  function pageVorlagen() {
    const id = st.vlId;
    const t = id === 'nachweis41a' ? { title: 'Nachweise für die abschließende Entscheidung', norm: '§ 41a Abs. 3 SGB II', fields: [['von', 'Vorläufig bewilligt ab', 'date'], ['bis', 'bis', 'date'], ['frist', 'Nachweise bis', 'date']] } : VL.T[id];
    return `<section class="card"><div class="card-head"><h2>Vorlagen</h2><span class="sub">nur Sachtext, ohne Namen und Aktenzeichen</span></div>
      <div class="chips">${VL_LIST().map(([k, l]) => `<button type="button" class="chip" data-va="vorlage" data-v="${k}" aria-pressed="${k === id}">${esc(l)}</button>`).join('')}</div></section>
      <section class="card"><div class="card-head tight"><h2>${esc(t.title)}</h2><span class="norm">${esc(t.norm)}</span></div>
        ${t.hint ? `<div class="note warn">${esc(t.hint)}</div>` : ''}
        <div class="grid row-gap">${t.fields.map(([k, l, type, opts]) => field(`vl.${id}.${k}`, l, type === 'money' ? 'money' : type, opts)).join('')}</div>
        <div class="btn-row row-gap"><button type="button" class="btn primary" data-va="vlWord">${A.ICON.doc} Als Word</button><button type="button" class="btn ghost" data-va="vlCopy">${A.ICON.copy} Kopieren</button></div>
        <pre class="preview row-gap" id="vlPreview">${esc(vorlageText())}</pre>
        <p class="hint">Prüfhilfe. Verbindlich sind die Vordrucke und Textbausteine Ihres Trägers.</p></section>`;
  }
  function pageUebung() {
    if (!st.ue) st.ue = VG.uebung(8);
    const right = st.ue.filter((x) => Number(st.ueAns[x.id]) === x.stufe).length;
    return `<section class="card"><div class="card-head"><h2>Übung: Tagesplanung</h2><span class="sub">nur fiktive Vorgänge</span></div>
      <p class="hint">Ordnen Sie jedem Vorgang eine Stufe zu: 1 = heute sofort, 2 = diese Woche, 3 = planbar mit Datum, 4 = Rest. Dann „Auflösen“.</p>
      <div class="ue">${st.ue.map((x) => {
        const a = Number(st.ueAns[x.id]);
        const ok = st.ueShown ? (a === x.stufe ? 'ok' : 'bad') : '';
        return `<div class="ue-item ${ok}"><p>${esc(x.text)}</p><div class="tri">${[1, 2, 3, 4].map((n) => `<button type="button" data-va="ue" data-id="${x.id}" data-v="${n}" aria-pressed="${a === n}">${n}</button>`).join('')}</div>
          ${st.ueShown ? `<div class="hint"><b>Richtig: Stufe ${x.stufe} (${esc(VG.STUFEN[x.stufe])}).</b> ${esc(x.why)}</div>` : ''}</div>`;
      }).join('')}</div>
      <div class="btn-row row-gap"><button type="button" class="btn primary" data-va="ueShow">Auflösen</button><button type="button" class="btn" data-va="ueNew">Neue Runde</button>${st.ueShown ? `<span class="sub">${right} von ${st.ue.length} richtig</span>` : ''}</div></section>`;
  }

  /* ---------- Steuerung ---------- */
  function navHTML() { $('#nav').innerHTML = NAV.map(([k, l]) => `<button type="button" data-va="go" data-v="${k}" aria-current="${(st.view === k || (k === 'start' && st.view === 'vorgang')) ? 'page' : 'false'}">${l}</button>`).join(''); }
  function show({ keepScroll = false } = {}) {
    const layout = $('.layout');
    navHTML();
    if (st.view === 'rechner') { layout.classList.remove('single'); A.render(); }
    else {
      layout.classList.add('single');
      $('#result').innerHTML = '';
      $('#form').innerHTML = ({ start: pageStart, vorgang: pageVorgang, fristen: pageFristen, vorlagen: pageVorlagen, uebung: pageUebung })[st.view]();
    }
    if (!keepScroll) window.scrollTo({ top: 0 });
  }
  const acts = {
    go: (el) => { st.view = el.dataset.v; show(); },
    vorgang: (el) => {
      const v = VG.V[el.dataset.v];
      if (v.rechner) { A.setKind(v.rechner); st.view = 'rechner'; show(); return; }
      st.vorgang = el.dataset.v; st.view = 'vorgang'; show();
    },
    vorlage: (el) => { st.vlId = el.dataset.v; st.view = 'vorlagen'; show(); },
    vlWord: () => A.saveDocx(vorlageText(), `${st.vlId}_${A.today()}.docx`),
    vlCopy: async () => { try { await A.copyText(vorlageText()); A.flash('Text kopiert.'); } catch (_) { A.flash('Kopieren nicht möglich.'); } },
    avWord: () => A.saveDocx(vermerkText(), `Aktenvermerk_${A.today()}.docx`),
    avCopy: async () => { try { await A.copyText(vermerkText()); A.flash('Aktenvermerk kopiert.'); } catch (_) { A.flash('Kopieren nicht möglich.'); } },
    ue: (el) => { st.ueAns[el.dataset.id] = el.dataset.v; show({ keepScroll: true }); },
    ueShow: () => { st.ueShown = true; show({ keepScroll: true }); },
    ueNew: () => { st.ue = VG.uebung(8); st.ueAns = {}; st.ueShown = false; show(); },
  };
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-va]');
    if (a && acts[a.dataset.va]) { e.preventDefault(); acts[a.dataset.va](a); }
  });
  function refreshFor(t) {
    const fr = t.closest('[data-frist]');
    if (fr) { const id = fr.dataset.frist, p = fr.dataset.prefix; const box = document.getElementById(`res_${p}_${id}`); if (box) box.innerHTML = fristResult(id, p); }
    if (st.view === 'vorlagen') { const pre = $('#vlPreview'); if (pre) pre.textContent = vorlageText(); }
  }
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!t.matches('[data-vb]') || t.type === 'checkbox') return;
    set(t.dataset.vb, t.value);
    if (t.classList.contains('vnote')) { t.style.height = 'auto'; t.style.height = `${t.scrollHeight}px`; }
    refreshFor(t);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (!t.matches('[data-vb]')) return;
    if (t.type === 'checkbox') {
      set(t.dataset.vb, t.checked);
      if (t.dataset.vb.startsWith('done.')) { show({ keepScroll: true }); return; }
      refreshFor(t); return;
    }
    if (t.hasAttribute('data-vdate')) { const n = C.normalizeDate(t.value); t.value = n; set(t.dataset.vb, n); t.classList.toggle('invalid', !!n && !C.validDate(n)); }
    else set(t.dataset.vb, t.value);
    refreshFor(t);
  });
  window.__WA_VIEWS__ = () => JSON.parse(JSON.stringify(st));
  show();
})();

</script>
